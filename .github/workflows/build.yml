name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install
          npm install -g @tauri-apps/cli@^2

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Create keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Patch Gradle signing config
        run: |
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          if ! grep -q "signingConfigs" "$GRADLE"; then
            python3 - "$GRADLE" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()

          # Add import
          if "import java.io.FileInputStream" not in s:
              s = "import java.io.FileInputStream\n" + s

          signing = '''
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = java.util.Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }
          '''

          # Insert into android { block
          s = s.replace('android {', 'android {\n' + signing, 1)

          # Reference signing config in release build
          s = re.sub(
              r'(buildTypes\s*\{.*?getByName\("release"\)\s*\{)',
              r'\1\n                signingConfig = signingConfigs.getByName("release")',
              s,
              count=1,
              flags=re.S
          )

          open(p, 'w').write(s)
          print("Patched build.gradle.kts")
          PY
          else
            echo "signingConfigs already present, skipping"
          fi

      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqis-ocr-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
