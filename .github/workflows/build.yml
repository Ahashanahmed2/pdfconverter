name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android }

      - uses: android-actions/setup-android@v3
      - run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - run: npm ci || npm install
      - run: npm install -g @tauri-apps/cli@^2
      - run: npx tauri android init

      # ===== মূল কী সাইনিং কনফিগারেশন =====
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/release.keystore

      - name: Create keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Configure Gradle signing
        run: |
          cd src-tauri/gen/android
          # build.gradle.kts-এ signingConfig যোগ করুন (অথবা Tauri-র অফিসিয়াল গাইড দেখুন)
          cat >> app/build.gradle.kts <<'EOF'
          android {
              signingConfigs {
                  create("release") {
                      val keystoreProperties = java.util.Properties()
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
                      }
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build APK
        run: npx tauri android build --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: aqis-ocr-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
