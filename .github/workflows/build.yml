name: Build and Sign Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==========================================
      # 3. Setup Rust
      # ==========================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # ==========================================
      # 4. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 5. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      # ==========================================
      # 6. Install NDK
      # ==========================================
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "ndk;26.1.10909125" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # ==========================================
      # 7. Install Dependencies
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # 8. Verify tauri CLI
      # ==========================================
      - name: Verify tauri CLI
        run: |
          ls -la node_modules/.bin/tauri
          npx tauri --version
          cat package.json | grep -A3 '"scripts"'

      # ==========================================
      # 8.5 Verify Kotlin plugin sources exist
      #     (UpdaterPlugin.kt না থাকলে অ্যাপ চালুতেই ক্র্যাশ করে)
      # ==========================================
      - name: Verify Kotlin plugin sources
        run: |
          set -e
          SRC=src-tauri/android-src
          for f in UpdaterPlugin.kt AdsPlugin.kt UpdateFileProvider.kt update_file_paths.xml; do
            test -f "$SRC/$f" || { echo "ERROR: $SRC/$f missing"; exit 1; }
          done
          # দুই ফাইলে একই ক্লাস থাকলে Kotlin "Redeclaration" error দেয়
          if grep -q "class DownloadArgs" "$SRC/UpdaterPlugin.kt" && grep -q "class DownloadArgs" "$SRC/AdsPlugin.kt"; then
            echo "ERROR: DownloadArgs is declared in both UpdaterPlugin.kt and AdsPlugin.kt."
            echo "Remove DownloadArgs and the update_* commands from AdsPlugin.kt."
            exit 1
          fi
          echo "Kotlin sources OK"

      # ==========================================
      # 9. Decode and Verify Keystore
      # ==========================================
      - name: Decode and Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: ANDROID_KEYSTORE_PASSWORD missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: ANDROID_KEY_ALIAS missing"; exit 1; }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.p12"
          chmod 600 "$RUNNER_TEMP/release-key.p12"

          echo "Verifying PKCS12 Keystore..."
          keytool -list \
            -keystore "$RUNNER_TEMP/release-key.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          echo "Keystore verification successful!"

      # ==========================================
      # 10. Init Android project
      # ==========================================
      - name: Init Android project
        run: |
          ls -la src-tauri/tauri.conf.json
          npx tauri android init --ci

      # ==========================================
      # 10.5 Patch Android (documentfile + proguard + largeHeap)
      # ==========================================
      - name: Patch Android project (documentfile + proguard)
        run: |
          set -e
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          PRO=src-tauri/gen/android/app/proguard-rules.pro

          test -f "$GRADLE" || { echo "ERROR: $GRADLE not found"; exit 1; }

          # 1) androidx.documentfile dependency যোগ
          sed -i '/^dependencies {/a\    implementation("androidx.documentfile:documentfile:1.0.1")' "$GRADLE"

          # 2) ProGuard / R8 keep rules যোগ
          touch "$PRO"
          cat >> "$PRO" << 'EOF'

          # ---- AQIS OCR patch ----
          -keep class androidx.documentfile.** { *; }
          -keep class app.tauri.** { *; }
          -keep class * extends app.tauri.plugin.Plugin { *; }
          -keep @app.tauri.annotation.TauriPlugin class * { *; }
          -keepclassmembers class * {
              @app.tauri.annotation.Command *;
          }
          EOF

          # 3) বড় ছবির জন্য heap বাড়ানো (largeHeap)
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<application android:largeHeap="true"/' "$MANIFEST"
          grep -n "largeHeap" "$MANIFEST" || { echo "ERROR: largeHeap not added"; exit 1; }

          echo "=== Verify patch ==="
          grep -n "documentfile" "$GRADLE" || { echo "ERROR: dependency not added"; exit 1; }
          echo "--- proguard-rules.pro ---"
          cat "$PRO"

      # ==========================================
      # 10.6 Install Kotlin updater plugin (in-app APK update)
      # ==========================================
      - name: Install Kotlin updater plugin
        run: |
          set -e
          APP=src-tauri/gen/android/app
          MAIN=$(find $APP/src/main/java -name MainActivity.kt | head -n1)
          test -n "$MAIN" || { echo "ERROR: MainActivity.kt not found"; exit 1; }
          KT_DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | awk '{print $2}')
          echo "Android package: $PKG"
          test "$PKG" = "com.aqis.ocr" || { echo "ERROR: package is $PKG, expected com.aqis.ocr"; exit 1; }

          # lib.rs অ্যাপ চালুতেই "UpdaterPlugin" রেজিস্টার করে — এটা না থাকলে অ্যাপ ক্র্যাশ করে
          cp src-tauri/android-src/UpdaterPlugin.kt "$KT_DIR/"
          cp src-tauri/android-src/UpdateFileProvider.kt "$KT_DIR/"
          test -f "$KT_DIR/UpdaterPlugin.kt" || { echo "ERROR: UpdaterPlugin.kt not copied"; exit 1; }

          mkdir -p $APP/src/main/res/xml
          cp src-tauri/android-src/update_file_paths.xml $APP/src/main/res/xml/

          # ProGuard keep
          echo "-keep class com.aqis.ocr.** { *; }" >> $APP/proguard-rules.pro

          # Manifest: install permission + FileProvider
          PKG="$PKG" python3 - << 'PY'
          import os
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          pkg = os.environ["PKG"]
          if "updatefileprovider" not in s:
              perm = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
              s = s.replace("<application", perm + "    <application", 1)
              prov = (
                  '        <provider\n'
                  '            android:name="' + pkg + '.UpdateFileProvider"\n'
                  '            android:authorities="${applicationId}.updatefileprovider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true">\n'
                  '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS"'
                  ' android:resource="@xml/update_file_paths" />\n'
                  '        </provider>\n'
              )
              s = s.replace("</application>", prov + "    </application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PY

          echo "=== Verify manifest ==="
          grep -n "REQUEST_INSTALL_PACKAGES\|updatefileprovider\|UpdateFileProvider" $APP/src/main/AndroidManifest.xml
          ls -la "$KT_DIR"

      # ==========================================
      # 10.7 Install AdMob plugin (banner + interstitial + consent)
      # ==========================================
      - name: Install AdMob plugin
        env:
          # GitHub → Settings → Variables → ADMOB_APP_ID (না দিলে Google-এর টেস্ট আইডি)
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          set -e
          APP=src-tauri/gen/android/app
          GRADLE=$APP/build.gradle.kts
          MAIN=$(find $APP/src/main/java -name MainActivity.kt | head -n1)
          KT_DIR=$(dirname "$MAIN")

          cp src-tauri/android-src/AdsPlugin.kt "$KT_DIR/"

          # Gradle dependency (24.0.0 — পুরনো Kotlin-এর সাথেও চলে)
          sed -i '/^dependencies {/a\    implementation("com.google.android.gms:play-services-ads:24.0.0")' "$GRADLE"
          sed -i '/^dependencies {/a\    implementation("com.google.android.ump:user-messaging-platform:3.1.0")' "$GRADLE"

          # R8 নিয়ম: বিজ্ঞাপন SDK WorkManager/Room টেনে আনে। R8 Room-এর খালি constructor
          # মুছে ফেললে অ্যাপ চালুতেই "Failed to create an instance of WorkDatabase" ক্র্যাশ হয়
          cat >> "$APP/proguard-rules.pro" << 'EOF'

          # ---- AdMob / WorkManager / Room ----
          -keep class * extends androidx.room.RoomDatabase { <init>(); }
          -keep class androidx.work.impl.WorkDatabase_Impl { <init>(); }
          -keep class * extends androidx.work.ListenableWorker {
              public <init>(android.content.Context, androidx.work.WorkerParameters);
          }
          -keep class androidx.startup.** { *; }
          -keep class com.google.android.gms.ads.** { *; }
          -dontwarn androidx.room.paging.**
          EOF

          # Manifest: AdMob App ID + AD_ID permission
          python3 - << 'PY'
          import os
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          app_id = os.environ["ADMOB_APP_ID"]
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              perm = '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n'
              s = s.replace("<application", perm + "    <application", 1)
              meta = (
                  '        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  '            android:value="' + app_id + '" />\n'
              )
              s = s.replace("</application>", meta + "    </application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PY

          echo "=== Verify AdMob patch ==="
          grep -n "play-services-ads\|user-messaging" "$GRADLE" || { echo "ERROR: ads dependency missing"; exit 1; }
          grep -n "APPLICATION_ID\|AD_ID" $APP/src/main/AndroidManifest.xml || { echo "ERROR: manifest patch failed"; exit 1; }
          echo "--- Kotlin plugins installed ---"
          ls -la "$KT_DIR"

      # ==========================================
      # 10.8 App icon + app name
      # ==========================================
      - name: Set app icon and name
        env:
          # & XML-এ লিখতে হয় &amp; হিসেবে
          APP_LABEL: "PDF&amp;Image Converter"
          ICON_FIT: contain   # বা cover
        run: |
          set -e
          # আইকন: রুটে app-icon.png থাকলে সেটা, নাহলে src-tauri/icons/icon.png
          if [ -f app-icon.png ]; then SRC=app-icon.png; else SRC=src-tauri/icons/icon.png; fi
          test -f "$SRC" || { echo "ERROR: icon not found ($SRC)"; exit 1; }
          echo "Icon source: $SRC"
          file "$SRC"
          cp "$SRC" "$RUNNER_TEMP/app-icon.png"
          # init-এর পরে চালালে Android-এর mipmap আইকনও নতুন করে লেখে।
          # ছবি বর্গাকার না হলে ICON_FIT লাগে: contain = পুরো ছবি রেখে ফাঁকা অংশ স্বচ্ছ,
          # cover = বর্গাকার করে কেটে নেয়
          npx tauri icon "$RUNNER_TEMP/app-icon.png" --fit "$ICON_FIT"
          ls -la src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/

          # অ্যাপের নাম (লঞ্চারে যা দেখায়)
          APP_LABEL="$APP_LABEL" python3 - << 'PY'
          import os, re
          p = "src-tauri/gen/android/app/src/main/res/values/strings.xml"
          s = open(p, encoding="utf-8").read()
          label = os.environ["APP_LABEL"]
          for key in ("app_name", "main_activity_title"):
              s = re.sub(r'(<string name="%s">)[^<]*(</string>)' % key,
                         lambda m: m.group(1) + label + m.group(2), s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          echo "=== strings.xml ==="
          cat src-tauri/gen/android/app/src/main/res/values/strings.xml
          grep -q "PDF&amp;Image Converter" src-tauri/gen/android/app/src/main/res/values/strings.xml || { echo "ERROR: app name patch failed"; exit 1; }

      # ==========================================
      # 11. Build Android APK
      # ==========================================
      - name: Build APK
        run: |
          npx tauri android build --apk --verbose

          echo "=== Checking dist ==="
          ls -la dist/ || echo "NO DIST FOLDER!"
          ls -la dist/assets/ || echo "NO ASSETS!"
          echo "=== dist/index.html ==="
          cat dist/index.html || echo "NO INDEX!"

      # ==========================================
      # 12. Locate, Align and Sign APK
      # ==========================================
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "Universal APK directory not found."
            find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          cd "$APK_DIR"
          echo "Available APK files:"
          ls -lh *.apk || true

          UNSIGNED_APK=""
          if [ -f "app-universal-release-unsigned.apk" ]; then
            UNSIGNED_APK="app-universal-release-unsigned.apk"
          elif [ -f "app-universal-release.apk" ]; then
            UNSIGNED_APK="app-universal-release.apk"
          else
            echo "No expected release APK found."
            find . -maxdepth 1 -name "*.apk"
            exit 1
          fi
          echo "Using APK: $UNSIGNED_APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          echo "Running Zipalign..."
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            "$UNSIGNED_APK" \
            app-universal-release-aligned.apk

          printf '%s\n' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass.txt"
          printf '%s\n' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"
          chmod 600 "$RUNNER_TEMP/ks-pass.txt" "$RUNNER_TEMP/key-pass.txt"

          echo "Signing APK..."
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release-key.p12" \
            --ks-type PKCS12 \
            --ks-pass "file:$RUNNER_TEMP/ks-pass.txt" \
            --key-pass "file:$RUNNER_TEMP/key-pass.txt" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app-universal-release-signed.apk \
            app-universal-release-aligned.apk

          echo "Verifying APK Signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app-universal-release-signed.apk

          echo "=================================="
          echo "APK SIGNING SUCCESSFUL"
          echo "=================================="
          ls -lh app-universal-release-signed.apk

          rm -f "$RUNNER_TEMP/ks-pass.txt" "$RUNNER_TEMP/key-pass.txt"

      # ==========================================
      # 13. Upload Signed APK
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfconverter-signed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 14. Cleanup Keystore
      # ==========================================
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-key.p12"
          rm -f "$RUNNER_TEMP/ks-pass.txt"
          rm -f "$RUNNER_TEMP/key-pass.txt"
