name: Build and Sign Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install
          npm install -g @tauri-apps/cli@^2

      - name: Init Tauri Android
        run: npx tauri android init

      # ============================================================
      # ধাপ ১: UNSIGNED APK বিল্ড (কোনো keystore/Gradle signing নেই)
      # ============================================================
      - name: Build unsigned APK
        run: npx tauri android build --apk --target aarch64

      - name: Locate unsigned APK
        id: find_apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      # ============================================================
      # ধাপ ২: apksigner দিয়ে সাইন
      # ============================================================
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
          ls -la $RUNNER_TEMP/release.keystore

      - name: Sign APK with apksigner
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          SIGNED="$(dirname "$APK")/app-signed-release.apk"

          # apksigner path খুঁজুন (build-tools)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          echo "Using apksigner: $APKSIGNER"

          # zipalign (সাইন করার আগে দরকার)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          "$ZIPALIGN" -v -p 4 "$APK" "$ALIGNED" || true

          # sign
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --out "$SIGNED" \
            "$ALIGNED"

          # যাচাই
          "$APKSIGNER" verify --print-certs "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> $GITHUB_ENV

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aqis-ocr-signed-apk
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
