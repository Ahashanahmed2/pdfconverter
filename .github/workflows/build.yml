
name: Build and Sign Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "ndk;26.1.10909125" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install
          npm install -D @tauri-apps/cli@^2

      # Decode and validate PKCS12 Keystore
      - name: Decode and Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "Keystore Base64 secret missing"
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.p12"

          chmod 600 "$RUNNER_TEMP/release-key.p12"

          keytool -list \
            -keystore "$RUNNER_TEMP/release-key.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Init Android project
        run: npx tauri android init --ci

      # Build APK
      - name: Build APK
        run: npx tauri android build --apk

      # Sign APK
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          cd "$APK_DIR"

          if [ -f "app-universal-release-unsigned.apk" ]; then
            UNSIGNED_APK="app-universal-release-unsigned.apk"
          elif [ -f "app-universal-release.apk" ]; then
            UNSIGNED_APK="app-universal-release.apk"
          else
            echo "Unsigned APK not found"
            ls -la
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            "$UNSIGNED_APK" \
            app-universal-release-aligned.apk

          # Password files
          KS_PASS_FILE="$RUNNER_TEMP/ks-pass.txt"
          KEY_PASS_FILE="$RUNNER_TEMP/key-pass.txt"

          printf '%s\n' "$KEYSTORE_PASSWORD" > "$KS_PASS_FILE"
          printf '%s\n' "$KEY_PASSWORD" > "$KEY_PASS_FILE"

          chmod 600 "$KS_PASS_FILE" "$KEY_PASS_FILE"

          # Sign using PKCS12
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release-key.p12" \
            --ks-type PKCS12 \
            --ks-pass "file:$KS_PASS_FILE" \
            --key-pass "file:$KEY_PASS_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app-universal-release-signed.apk \
            app-universal-release-aligned.apk

          # Verify signature
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            app-universal-release-signed.apk

          rm -f "$KS_PASS_FILE" "$KEY_PASS_FILE"

      # Upload signed APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfconverter-signed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk
          if-no-files-found: error
