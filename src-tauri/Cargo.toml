[package]
name = "aqis-ocr"
version = "2.0.1"
edition = "2021"

[lib]
name = "aqis_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-scoped-storage = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
hayro = "0.8"
hayro-interpret = "0.8"
base64 = "0.22"
