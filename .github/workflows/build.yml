name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: 20

      - uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with: 
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # ❌ এই লাইনটি বাদ দেওয়া হয়েছে (এটিই এরর দিচ্ছিল)
      # - uses: android-actions/setup-android@v3

      - name: Install Android NDK & Accept Licenses
        run: |
          # ubuntu-latest এ ANDROID_HOME আগে থেকেই সেট করা থাকে
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Initialize Tauri Android
        run: npx tauri android init

      # ===== সহজ এবং নিরাপদ কী সাইনিং পদ্ধতি =====
      - name: Decode Keystore
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/release.keystore

      - name: Build Signed APK
        env:
          # Tauri v2 সরাসরি এই Environment Variable গুলো পড়ে সাইনিং করে
          # এর ফলে build.gradle.kts ম্যানুয়ালি এডিট করার ঝামেলা নেই
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqis-ocr-apk
          # Tauri v2 তে সাইন করা APK সাধারণত এই পাথে তৈরি হয়
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
